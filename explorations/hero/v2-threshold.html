<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PŽ — V2 Threshold</title>
<link rel="stylesheet" href="assets/shared.css">
<style>
  .veil {
    background:
      linear-gradient(180deg, rgba(8,8,8,.7) 0%, rgba(8,8,8,0) 30%),
      linear-gradient(180deg, rgba(8,8,8,0) 70%, rgba(8,8,8,.85) 100%);
  }
  .center {
    position: absolute;
    top: 21%;
    left: 0; right: 0;
    z-index: 4;
    text-align: center;
  }
  .kicker {
    font-size: 12px;
    letter-spacing: 0.5em;
    text-indent: 0.5em;
    text-transform: uppercase;
    color: var(--mid);
    margin-bottom: 26px;
  }
  h1 {
    font-stretch: 125%;
    font-weight: 900;
    text-transform: uppercase;
    line-height: 0.9;
    font-size: clamp(56px, 8.6vw, 128px);
    background: linear-gradient(0deg, #ffffff 0%, #b9b9b9 45%, #5a5a5a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tag {
    margin-top: 28px;
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    text-transform: uppercase;
    color: var(--mid);
  }
  .cue {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 88px;
    z-index: 4;
    font-size: 10px;
    letter-spacing: 0.4em;
    text-indent: 0.4em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .plate.mobile { display: none; }
  @media (max-width: 720px) {
    .plate.desktop { display: none; }
    .plate.mobile { display: block; }
    .center { top: 18%; }
    h1 { font-size: clamp(44px, 12.5vw, 84px); }
    .tag { padding: 0 30px; }
  }
</style>
</head>
<body>
<section class="hero">
  <img class="plate desktop" src="assets/img/portal.jpg" alt="">
  <img class="plate mobile" src="assets/img/portal-portrait.jpg" alt="">
  <div class="veil"></div>
  <nav>
    <span class="mark">PŽ</span>
    <span class="links"><a href="#">Work</a><a href="#">About</a><a href="#">Contact</a></span>
  </nav>
  <div class="center">
    <p class="kicker">Portfolio — 2026</p>
    <h1>Petar<br>Živković</h1>
    <p class="tag">End-to-end design for mobile &amp; web</p>
  </div>
  <p class="cue">Enter</p>
  <div class="strip">
    <span>Interface Designer</span>
    <span class="idx"><span><b>01</b>Uštedi</span><span><b>02</b>STMNT</span><span><b>03</b>SkyAccess</span></span>
  </div>
</section>
</body>
</html>
